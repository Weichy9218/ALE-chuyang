harness: ale_claw
id: ale_claw_prep_v18
executor: local
model: openai/gpt-5.6-sol

config:
  max_turns: 100000
  thinking_level: "medium"
  flush_thinking_level: "off"
  compaction_thinking_level: "off"
  vision_thinking_level: "off"
  gui_thinking_level: "off"
  substrate_transport: mcp
  gui_transport: null
  disable_delegate_gui: true
  # The writer keeps the base tool policy so prep is the only variable. The prep
  # worker is handed the unfiltered tool list, so it still has web_search and
  # web_fetch.
  disabled_tools:
    - web_search
    - computer
    - analyze_image
  task_specific_prep: true
  task_specific_prep_max_steps: 30
  task_specific_prep_timeout_s: 1800
  verifier: false
  verifier_max_steps: 30
  verifier_max_review_rounds: 1
