# ============================================================================
# Harness control panel — the ONE file you edit to control a run.
# After editing, on the run box:
#   .venv/bin/python harness/run/launch.py --stack .            # prints launch cmd
#   .venv/bin/python harness/run/launch.py --stack . --launch   # generates + runs
# It regenerates the arm presets + the experiment yaml + the launch env from the
# values below. No other file needs hand-editing, and results are read back with
#   python3 harness/run/summarize.py <output_root> --baseline ale_claw_base
# ============================================================================

# --- arms: each arm = (task-specific prep on/off) x (verifier on/off). ---
# Pick any subset of:
#   base           prep off, verifier off
#   prep           prep on,  verifier off
#   verifier       prep off, verifier on
#   prep_verifier  prep on,  verifier on
arms: [base, prep, verifier, prep_verifier]

# --- agent runtime (shared by every arm; the only place these are set) ---
agent:
  model: openai/gpt-5.6-sol
  max_turns: 100000        # effectively uncapped. COGNITION forbids turn/time caps:
                           # an unequal budget silently manufactures fake effects.
  thinking_level: medium

# --- task-specific prep agent (default-off outside explicit experiment arms) ---
prep:
  max_steps: 15            # v2 observed range was 3-12 LLM turns

# --- independent verifier (fresh builder + runner; audit-only by default) ---
verifier:
  max_steps: 30
  # Smoke found a source ambiguity that the runner described correctly but
  # still marked fail. Opt into artifact mutation only after task-level audit.
  max_repairs: 0

# --- run ---
run:
  tasks: docs/harness/research_batch_wcy.txt
  concurrency: 3           # with launch.py --per-arm this is PER ARM (4 arms x 3 = 12 total).
                           # NOTE: 4x6=24 collapsed provisioning (Computer API Server readiness
                           # timeouts). The ceiling is concurrent SANDBOX BOOTS, not API throughput.
  cleanup_mode: delete     # delete each unit's container when it ends. 'keep' piles up one live
                           # sandbox per unit and starves the box; outputs are pulled before cleanup.
  # (key, base) shell prefixes rotated one-per-arm so no single endpoint bottlenecks.
  # launch.py derives both normalized bases after loading secret/.env. ale_url has
  # existed both with and without /v1, so BOYUE_OPENAI_BASE adds it idempotently.
  # Keys are gateway-specific and must not be mixed.
  # Empty list -> every arm uses the secret/.env defaults.
  api_endpoints: [OPENAI_API_KEY=$GPT_sub2api_apikey_2 OPENAI_API_BASE=$GPT_SUB2API_OPENAI_BASE OPENAI_BASE_URL=$GPT_SUB2API_OPENAI_BASE, OPENAI_API_KEY=$GPT_sub2api_apikey OPENAI_API_BASE=$GPT_SUB2API_OPENAI_BASE OPENAI_BASE_URL=$GPT_SUB2API_OPENAI_BASE, OPENAI_API_KEY=$ale_api_key OPENAI_API_BASE=$BOYUE_OPENAI_BASE OPENAI_BASE_URL=$BOYUE_OPENAI_BASE]
  output_root: .logs/ale/verifier_compare
  wall_time_s: 86400
