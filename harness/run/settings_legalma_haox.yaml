# legal_ma refined-hint test on HAOXIANG.
# boyue cannot run tools+thinking (its gpt-5.6-sol demands /v1/responses; the
# harness uses /v1/chat/completions), so it can't preserve the thinking summary.
# haoxiang runs tools+reasoning_effort AND now returns reasoning_content (summary)
# after the thinking.py transport=chat change. Two changes vs typohint26h legal_ma:
#   1. refined typo hint (report misprint verbatim as a finding; satisfy /input first)
#   2. reasoning_effort transport -> thinking summary now captured
# Goal: does legal_ma catch target_a (the 空股股东 misprint) without losing b/c/d?

arms: [prep, verifier]

agent:
  model: openai/gpt-5.6-sol
  max_turns: 100000
  thinking_level: medium

prep:
  max_steps: 50
  timeout_s: 1800

verifier:
  max_steps: 30
  max_review_rounds: 1
  writer_checks: 8

run:
  name: legalma_haox
  tasks: docs/harness/results/legalma_boyue_tasks.txt
  concurrency: 2
  cleanup_mode: delete
  secret_file: secret/.env.haoxiang
  api_endpoints: []
  output_root: .logs/ale/legalma_haox
  wall_time_s: 86400
