[project]
name = "ale-argus"
version = "0.1.0"
description = "Argus multi-role harness deployer for ALE (in-VM / sandbox executor)."
requires-python = ">=3.11"
# Intentionally empty. ``argus-skill`` is NOT declared here: its version and
# source are per-experiment knobs (``ArgusConfig.argus_package`` — a pinned
# release, a mirror, or a VCS spec), and ``install()`` pip-installs it inside
# the sandbox after the executor has placed the deployer. The deployer module
# itself imports nothing but the stdlib and ``ale_run``.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Per-agent workspace member marker only; the real package ships with ale_run.
only-include = []
sources = {}
bypass-selection = true
